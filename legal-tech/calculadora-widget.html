<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget: Calculadora de Prescrição</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="mapa.css?v=20261008">
    
    <style>
        /* Reseta o body para o widget */
        body {
            background-color: transparent !important; /* Fundo transparente */
            padding: 0;
            margin: 0;
            overflow: hidden; /* Sem barras de rolagem */
        }
        main {
            padding: 0;
            margin: 0;
        }
        /* Ajusta o wizard para o widget */
        .calc-wizard-wrapper {
            margin: 0;
            max-width: 100%;
            border: none;
            box-shadow: none;
            padding: 20px 10px; /* Mais apertado */
            background-color: var(--cor-fundo-card); /* Garante o fundo escuro */
        }
        .calc-step h3 {
            font-size: 1.8rem;
        }
        .calc-choice-btn {
            font-size: 1.3rem;
            padding: 15px;
        }
        .form-calculadora-v2 {
            grid-template-columns: 1fr; /* Coluna única sempre */
            gap: 15px;
        }
        .botao-calcular, .botao-cta-artigo {
            font-size: 1.5rem;
            padding: 15px;
        }
        /* [GENIAL] Adiciona a "MARCA" no final */
        .widget-footer {
            text-align: center;
            padding: 15px;
            background-color: #111;
            border-top: 1px solid var(--cor-borda);
        }
        .widget-footer p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--cor-texto-secundario);
        }
        .widget-footer a {
            color: var(--cor-ouro-destaque);
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body style="background-color: #1a1a1a;">

    <main>
        <div class="calc-wizard-wrapper">
            <input type="hidden" id="tipoPrescricao" value="">
            <input type="hidden" id="tipoPPP" value="">
            
            <div class="calc-step" id="step-1-tipo">
                <h3>Passo 1: Qual o status do processo?</h3>
                <div class="calc-choices">
                    <button class="calc-choice-btn" onclick="selectTipo('PPP')">Ainda NÃO fui condenado definitivamente</button>
                    <button class="calc-choice-btn" onclick="selectTipo('PPE')">JÁ FUI condenado definitivamente</button>
                </div>
            </div>
            
            <div class="calc-step" id="step-2-ppp">
                <h3>Passo 2 (PPP): Já existe uma sentença?</h3>
                <div class="calc-choices">
                    <button class="calc-choice-btn" onclick="selectTipoPPP('Abstrata')">NÃO (Processo em andamento)</button>
                    <button class="calc-choice-btn" onclick="selectTipoPPP('Retroativa')">SIM (Já tenho sentença)</button>
                </div>
            </div>
            
            <div class="calc-step" id="step-3-inputs-ppp-abstrata">
                <h3>Preencha os dados (PPP em Abstrato)</h3>
                <form class="form-calculadora-v2" onsubmit="return false;">
                    <div class="form-grupo"><label>Pena Máxima do Crime (anos)</label><input type="number" id="ppp-pena-max" placeholder="Ex: 8"></div>
                    <div class="form-grupo"><label>Data do Fato</label><input type="date" id="ppp-data-fato"></div>
                    <div class="form-grupo"><label>Data do Recebimento da Denúncia</label><input type="date" id="ppp-data-denuncia"></div>
                    <div class="form-grupo full-width"><button class="botao-calcular" onclick="calcularPrescricao()">Calcular Diagnóstico</button></div>
                </form>
            </div>
            
            <div class="calc-step" id="step-3-inputs-ppp-retro">
                <h3>Preencha os dados (PPP Retroativa)</h3>
                <form class="form-calculadora-v2" onsubmit="return false;">
                    <div class="form-grupo"><label>Pena Aplicada (anos)</label><input type="number" id="ppp-retro-pena" placeholder="Ex: 2"></div>
                    <div class="form-grupo"><label>Data do Fato</label><input type="date" id="ppp-retro-fato"></div>
                    <div class="form-grupo"><label>Data Receb. Denúncia</label><input type="date" id="ppp-retro-denuncia"></div>
                    <div class="form-grupo"><label>Data Public. Sentença</label><input type="date" id="ppp-retro-sentenca"></div>
                    <div class="form-grupo full-width"><button class="botao-calcular" onclick="calcularPrescricao()">Calcular Diagnóstico</button></div>
                </form>
            </div>
            
            <div class="calc-step" id="step-3-inputs-ppe">
                <h3>Preencha os dados (PPE)</h3>
                <form class="form-calculadora-v2" onsubmit="return false;">
                    <div class="form-grupo"><label>Pena Aplicada (anos)</label><input type="number" id="ppe-pena" placeholder="Ex: 4"></div>
                    <div class="form-grupo"><label>Data do Trânsito em Julgado</label><input type="date" id="ppe-data-transito"></div>
                    <div class="form-grupo checkbox-group"><input type="checkbox" id="ppe-reincidente"><label for="ppe-reincidente">O réu é reincidente?</label></div>
                    <div class="form-grupo full-width"><button class="botao-calcular" onclick="calcularPrescricao()">Calcular Diagnóstico</button></div>
                </form>
            </div>
            
            <div id="calc-resultado" class="">
                </div>
        </div>

        <footer class="widget-footer">
            <p>Powered by <a href="https://lucassemim.adv.br" target="_blank">Dr. Lucas Semim | Advocacia Live</a></p>
        </footer>
    </main>

    <script src="codelei/prescricao.js?v=20261008" defer></script>
    
</body>
</html>
