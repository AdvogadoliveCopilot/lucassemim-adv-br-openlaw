<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJe | Processo Judicial Eletrônico | Lucas Semim</title>
    <meta name="description" content="Painel processual (PJe) de acompanhamento de andamentos, movimentações e documentos do processo. Acesso restrito a clientes autenticados.">
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pje: #121214;
            --bg-card: #1e1e24;
            --gold: #d4af37;
            --text-main: #e1e1e6;
            --text-muted: #a8a8b3;
            --border: #323238;
        }

        body {
            background-color: var(--bg-pje);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* SIDEBAR (MENU LATERAL) */
        .pje-sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 80px;
            background: #09090a; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px;
            z-index: 100;
        }
        .pje-logo { font-size: 1.8rem; margin-bottom: 40px; filter: grayscale(1); transition:0.3s; cursor:pointer;}
        .pje-logo:hover { filter: grayscale(0); }
        
        .pje-menu-item {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; margin-bottom: 15px; color: var(--text-muted);
            cursor: pointer; transition: 0.3s; font-size: 1.2rem;
        }
        .pje-menu-item:hover, .pje-menu-item.active {
            background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* MAIN CONTENT */
        .pje-main { margin-left: 80px; padding: 30px; }

        /* HEADER DO PROCESSO */
        .proc-header {
            background: var(--bg-card); border: 1px solid var(--border);
            border-top: 4px solid var(--gold); border-radius: 8px;
            padding: 25px; margin-bottom: 30px;
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px;
        }
        .proc-info h1 {
            font-family: 'Fira Code'; font-size: 1.6rem; color: var(--gold); margin: 0 0 10px 0;
            display: flex; align-items: center; gap: 10px;
        }
        .proc-badge { font-size: 0.7rem; background: #333; padding: 2px 8px; border-radius: 4px; color: #fff; vertical-align: middle; }
        
        .proc-details span { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .proc-details strong { color: #fff; }

        .proc-parties { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 6px; font-size: 0.9rem; }
        .party-tag { color: var(--gold); font-weight: bold; font-family: 'Teko'; font-size: 1.1rem; }

        /* TIMELINE (TABELA) */
        .pje-table-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
        }
        .pje-table-header {
            background: #29292e; padding: 15px 25px; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .pje-table { width: 100%; border-collapse: collapse; }
        .pje-table th, .pje-table td { padding: 20px 25px; text-align: left; }
        .pje-table tr { border-bottom: 1px solid var(--border); transition: 0.2s; }
        .pje-table tr:hover { background: rgba(212, 175, 55, 0.05); }

        .col-data { width: 150px; font-family: 'Fira Code'; }
        .pje-date { display: block; color: #fff; font-weight: bold; }
        .pje-time { font-size: 0.8rem; color: var(--text-muted); }

        .col-desc { }
        .mov-evento { font-size: 1rem; color: #e1e1e6; font-weight: 600; }
        .mov-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        .col-doc { width: 80px; text-align: center; }
        .doc-icon { font-size: 1.5rem; cursor: pointer; transition: 0.3s; opacity: 0.5; }
        .doc-icon.pdf:hover { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 5px #fff); }
        .doc-icon.lock { cursor: not-allowed; }

        /* RESPONSIVO */
        @media(max-width: 900px) {
            .proc-header { grid-template-columns: 1fr; }
            .pje-sidebar { display: none; } /* Mobile Menu seria ideal, mas simplificamos aqui */
            .pje-main { margin-left: 0; }
            .col-data { width: 100px; font-size: 0.8rem; }
        }
    </style>
    <script src="../js/header-elite.js?v=20261015"></script>
</head>
<body>

    <aside class="pje-sidebar">
        <div class="pje-logo" onclick="window.location.href='index.html'" title="Voltar ao Site">⚖️</div>
        
        <div class="pje-menu-item active" title="Movimentações">📄</div>
        <div class="pje-menu-item" title="Intimações">📢</div>
        <div class="pje-menu-item" title="Financeiro">💰</div>
        <div class="pje-menu-item" title="Configurações">⚙️</div>

        <div style="margin-top: auto; margin-bottom: 20px;">
            <div class="pje-menu-item" onclick="window.location.href='painel-cliente.html'" title="Sair">🚪</div>
        </div>
    </aside>

    <main class="pje-main" id="pje-container">
        
        <header class="proc-header">
            <div class="proc-info">
                <h1>
                    <span id="proc-num">...</span> 
                    <span class="proc-badge">DIGITAL</span>
                </h1>
                <div class="proc-details">
                    <span>CLASSE: <strong id="proc-classe">...</strong></span>
                    <span>ASSUNTO: <strong id="proc-assunto">...</strong></span>
                    <span>JUIZ: <strong id="proc-juiz">...</strong></span>
                </div>
            </div>

            <div class="proc-details" style="border-left: 1px solid var(--border); padding-left: 20px;">
                <span>VARA / COMARCA</span>
                <strong id="proc-juizo" style="font-size:1.1rem; color:var(--gold);">...</strong>
                <br>
                <span>VALOR DA CAUSA</span>
                <strong id="proc-valor">...</strong>
            </div>

            <div class="proc-parties">
                <div><span class="party-tag">AUTOR:</span> <span id="partes-autor">...</span></div>
                <div style="margin-top:10px;"><span class="party-tag">RÉU:</span> <span id="partes-reu">...</span></div>
            </div>
        </header>

        <section class="pje-table-card">
            <div class="pje-table-header">
                <span>Últimas Movimentações</span>
                <span style="font-size:0.8rem;">Atualizado em Tempo Real • PJe</span>
            </div>
            
            <table class="pje-table">
                <tbody id="mov-table-body">
                    <tr><td colspan="3" style="text-align:center; padding:50px;">Carregando dados processuais...</td></tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="codeleicivel/civel-process-db.js"></script>
    <script src="codeleicivel/civel-pje-engine.js"></script>

</body>
</html>
