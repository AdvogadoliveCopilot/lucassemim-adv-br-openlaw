<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Central de Comandos · Dr. Lucas Semim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050505; --ink-2:#0b0b0d; --panel:#101013; --panel-2:#16161b; --panel-3:#1d1d23;
  --gold:#d4af37; --gold-hi:#f6e7a6; --gold-lo:#9a7a16;
  --line:rgba(212,175,55,.26); --line-soft:rgba(255,255,255,.09);
  --text:#ece9e1; --muted:#a6a298; --faint:#7d796f;
  --ok:#3ddc84; --warn:#e8b339; --bad:#ff6b5e;
  --r:8px; --ease:cubic-bezier(.2,.7,.2,1);
  --side:232px; --top:58px; --tab:64px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--ink); color:var(--text);
  font:400 1rem/1.55 'Lato',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 40% at 8% -5%, rgba(212,175,55,.10), transparent 70%);
  background-repeat:no-repeat;
}
::selection{background:var(--gold); color:#000}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--gold)}
.ic{width:20px; height:20px; flex:none; fill:none; stroke:currentColor}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- barra de carregamento ---------- */
.loadbar{position:fixed; top:0; left:0; right:0; height:3px; z-index:300; overflow:hidden; background:rgba(212,175,55,.15)}
.loadbar::after{content:""; position:absolute; inset:0; width:35%; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:slide 1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ---------- topo ---------- */
.top{
  position:sticky; top:0; z-index:50; height:var(--top); display:flex; align-items:center; gap:12px;
  padding:0 16px; background:rgba(5,5,5,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; margin-right:auto}
.brand-ic{width:30px; height:30px; color:var(--gold)}
.brand-tx{display:flex; flex-direction:column; min-width:0; line-height:1.05}
.brand-tx b{font:600 1.45rem/1 'Teko','Arial Narrow',Impact,sans-serif; text-transform:uppercase; letter-spacing:.07em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-tx span{font-size:.7rem; color:var(--muted); letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kbtn{
  display:flex; align-items:center; gap:10px; height:38px; padding:0 8px 0 12px; min-width:0;
  background:rgba(255,255,255,.05); border:1px solid var(--line-soft); border-radius:6px; color:var(--muted); cursor:pointer;
}
.kbtn:hover{border-color:var(--line); color:var(--text)}
.kbtn-tx{font-size:.85rem; white-space:nowrap}
kbd{font:700 .66rem/1 var(--mono); padding:4px 6px; border:1px solid var(--line-soft); border-radius:4px; background:rgba(255,255,255,.06); color:var(--muted)}
.who{font-size:.75rem; color:var(--faint); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{width:40px; height:40px; display:grid; place-items:center; border-radius:6px; border:1px solid transparent; background:none; color:var(--muted); cursor:pointer}
.iconbtn:hover{color:var(--gold); border-color:var(--line)}
.iconbtn.spin .ic{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- estrutura ---------- */
.shell{display:block}
#main{display:block; padding:0 0 calc(var(--tab) + 28px); outline:none}
.page{max-width:1100px; margin:0 auto; padding:22px 16px 8px}

/* menu: barra de baixo no celular, lateral no computador */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60; height:var(--tab); display:flex;
  background:rgba(8,8,10,.97); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  box-sizing:content-box;
}
.nav button{
  flex:1; min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:0; color:var(--muted); font-size:.68rem; font-weight:700; letter-spacing:.04em; cursor:pointer; border-top:2px solid transparent;
}
.nav button[aria-current="page"]{color:var(--gold-hi); border-top-color:var(--gold); background:linear-gradient(180deg,rgba(212,175,55,.10),transparent)}
.nav button:hover{color:var(--text)}
.badge{
  position:absolute; top:6px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--warn); color:#1a1405;
  font:900 .66rem/18px 'Lato',sans-serif; text-align:center; font-style:normal;
}
@media (min-width:900px){
  .shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr); align-items:start}
  #main{padding-bottom:48px}
  .page{padding:30px 32px 8px}
  .nav{
    position:sticky; top:var(--top); left:auto; right:auto; bottom:auto; height:calc(100vh - var(--top)); flex-direction:column; justify-content:flex-start;
    gap:4px; padding:22px 12px; border-top:0; border-right:1px solid var(--line-soft); background:transparent; box-sizing:border-box;
  }
  .nav button{
    flex:none; flex-direction:row; justify-content:flex-start; gap:12px; padding:12px 14px; font-size:.95rem; letter-spacing:.02em;
    border-top:0; border-left:3px solid transparent; border-radius:6px;
  }
  .nav button[aria-current="page"]{border-left-color:var(--gold); background:linear-gradient(90deg,rgba(212,175,55,.14),transparent)}
  .badge{position:static; margin-left:auto}
}
@media (max-width:640px){
  .kbtn-tx,.kbtn kbd,.who{display:none}
  .kbtn{width:40px; padding:0; justify-content:center; flex:none}
  .brand-tx span{display:none}
  .brand-tx b{font-size:1.25rem; letter-spacing:.04em}
  .sec-h{flex-direction:column; align-items:flex-start; gap:2px}
}

/* ---------- títulos ---------- */
.pagehead{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 20px; margin:0 0 20px}
.pagehead .grow{flex:1 1 260px; min-width:0}
h1{font:600 clamp(2.1rem,6vw,3rem)/.95 'Teko','Arial Narrow',Impact,sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0; text-wrap:balance}
.lead{color:var(--muted); margin:6px 0 0; font-size:.95rem}
h2{font:600 1.3rem/1.1 'Teko','Arial Narrow',Impact,sans-serif; text-transform:uppercase; letter-spacing:.09em; color:var(--gold-hi); margin:0}
.sec{margin-top:30px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line-soft)}
.sec-h small{color:var(--faint); font-size:.78rem}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--mono); font-size:.86em; letter-spacing:.01em}
.small{font-size:.82rem}

/* ---------- números do dia ---------- */
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid var(--line-soft); border-radius:var(--r); background:var(--panel); overflow:hidden}
.stat{
  appearance:none; text-align:left; background:none; border:0; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  padding:14px 16px 12px; cursor:default; display:flex; flex-direction:column; gap:2px; min-height:92px;
}
.stat:nth-child(2n){border-right:0}
.stat:nth-last-child(-n+2){border-bottom:0}
.stat.link{cursor:pointer}
.stat.link:hover{background:rgba(212,175,55,.06)}
.stat b{font:600 2.7rem/1 'Teko','Arial Narrow',Impact,sans-serif; color:var(--gold-hi); letter-spacing:.01em}
.stat.warn b{color:var(--warn)}
.stat span{font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
@media (min-width:760px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat,.stat:nth-child(2n),.stat:nth-last-child(-n+2){border-right:1px solid var(--line-soft); border-bottom:0}
  .stat:last-child{border-right:0}
}

/* ---------- ações rápidas ---------- */
.quick{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 0}

/* ---------- botões ---------- */
.btn{
  min-height:44px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  font:700 .86rem/1 'Lato',sans-serif; letter-spacing:.05em; text-transform:uppercase; text-decoration:none; white-space:nowrap;
  transition:background .15s var(--ease), border-color .15s var(--ease), transform .08s;
}
.btn:hover{background:rgba(212,175,55,.10); border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#e6c24f,#c79d22); color:#1a1405; border-color:#c79d22}
.btn.pri:hover{background:linear-gradient(180deg,#f0cd5b,#d4af37)}
.btn.danger{color:var(--bad); border-color:rgba(255,107,94,.45)}
.btn.danger:hover{background:rgba(255,107,94,.10); border-color:var(--bad)}
.btn.ghost{border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--gold-hi); background:rgba(255,255,255,.05); border-color:transparent}
.btn.sm{min-height:36px; padding:0 12px; font-size:.74rem}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn.busy{position:relative; color:transparent!important}
.btn.busy::after{content:""; position:absolute; width:16px; height:16px; border-radius:50%; border:2px solid currentColor; border-color:var(--gold) transparent var(--gold) transparent; animation:rot .7s linear infinite}
.btn.pri.busy::after{border-color:#1a1405 transparent #1a1405 transparent}
.btn .ic{width:17px; height:17px}

/* ---------- lista de linhas ---------- */
.rows{display:grid; gap:8px}
.row{
  display:grid; gap:6px; padding:12px 14px; background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r);
  text-align:left; width:100%; color:inherit; font:inherit;
}
button.row{cursor:pointer}
button.row:hover,.row.click:hover{border-color:var(--line); background:var(--panel-2)}
.row .top1{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px}
.row .top1 strong{font-weight:900; letter-spacing:.01em}
.row .grow{flex:1 1 auto; min-width:0}
.row .meta{display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--muted); font-size:.82rem}
.row p{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
.row .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.row.urg{border-left:3px solid var(--bad)}
.row.off{opacity:.62}
.empty{padding:22px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line-soft); border-radius:var(--r); font-size:.92rem}
.skel{height:64px; border-radius:var(--r); background:linear-gradient(90deg,var(--panel) 0,var(--panel-2) 50%,var(--panel) 100%); background-size:200% 100%; animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- selos ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; border:1px solid var(--line);
  font:900 .64rem/1.5 'Lato',sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--gold-hi); background:rgba(212,175,55,.08); white-space:nowrap;
}
.pill.ok{color:var(--ok); border-color:rgba(61,220,132,.4); background:rgba(61,220,132,.08)}
.pill.warn{color:var(--warn); border-color:rgba(232,179,57,.45); background:rgba(232,179,57,.09)}
.pill.bad{color:var(--bad); border-color:rgba(255,107,94,.5); background:rgba(255,107,94,.09)}
.pill.mute{color:var(--muted); border-color:var(--line-soft); background:rgba(255,255,255,.04)}
.pill .ic{width:12px; height:12px}

/* ---------- formulários ---------- */
.form{display:grid; gap:14px}
.grid2{display:grid; gap:14px; grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:grid; gap:6px; align-content:start}
.field label,.lbl{font:700 .68rem/1 'Lato',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.field input,.field select,.field textarea,.input{
  width:100%; min-height:44px; padding:10px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05); color:#fff; font:400 1rem 'Lato',sans-serif;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.field textarea{min-height:92px; resize:vertical; line-height:1.5}
.field select{appearance:none; -webkit-appearance:none; padding-right:34px; background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%); background-position:calc(100% - 19px) 55%,calc(100% - 13px) 55%; background-size:6px 6px; background-repeat:no-repeat}
.field select option{background:#131316; color:#fff}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none; border-color:var(--gold); background:rgba(212,175,55,.07); box-shadow:0 0 0 3px rgba(212,175,55,.16)}
.field input[type="date"]{color-scheme:dark}
.dica{color:var(--faint); font-size:.78rem; line-height:1.4}
.chk{display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:6px 0; min-height:36px}
.chk input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--gold); flex:none}
.chk span{font-size:.95rem}
.chk small{display:block; color:var(--faint); font-size:.78rem}
.box{padding:16px; background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r)}
.box.gold{border-color:var(--line); background:linear-gradient(180deg,rgba(212,175,55,.08),rgba(212,175,55,.02))}
.box h3{font:600 1.15rem/1.1 'Teko',sans-serif; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px; color:var(--gold-hi)}
.box p{margin:0 0 12px; color:var(--muted); font-size:.92rem}
.bar-acts{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.saved{color:var(--ok); font-size:.82rem}

/* ---------- filtros ---------- */
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 14px}
.tools .search{flex:1 1 220px; min-width:0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  min-height:36px; padding:0 14px; border-radius:99px; border:1px solid var(--line-soft); background:transparent; color:var(--muted);
  font:700 .76rem/1 'Lato',sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
}
.chip:hover{color:var(--text); border-color:var(--line)}
.chip[aria-pressed="true"]{color:#1a1405; background:var(--gold); border-color:var(--gold)}

/* ---------- abas do caso ---------- */
.tabs{display:flex; gap:2px; overflow-x:auto; margin:0 0 18px; border-bottom:1px solid var(--line-soft); -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.tabs button{
  flex:none; min-height:44px; padding:0 14px; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); cursor:pointer;
  font:700 .8rem/1 'Lato',sans-serif; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--gold-hi); border-bottom-color:var(--gold)}
.tabs .n{margin-left:6px; font-weight:700; color:var(--faint)}
.back{margin:0 0 14px}
@media (max-width:640px){
  .tabs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; overflow:visible; border-bottom:0}
  .tabs button{min-height:44px; padding:0 4px; border:1px solid var(--line-soft); border-radius:6px; font-size:.7rem; letter-spacing:.04em; white-space:normal; line-height:1.15}
  .tabs button[aria-selected="true"]{border-color:var(--gold); background:rgba(212,175,55,.14); color:var(--gold-hi)}
}

/* ---------- senha / credenciais ---------- */
.cred{display:grid; gap:10px; margin:14px 0}
.cred dl{margin:0; display:grid; gap:10px}
.cred dt{font:700 .66rem/1 'Lato',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.cred dd{margin:0; overflow-wrap:anywhere}
.senha{
  font:700 1.55rem/1.2 var(--mono); letter-spacing:.12em; color:var(--gold-hi); padding:12px 14px; border:1px dashed var(--gold);
  border-radius:6px; background:rgba(212,175,55,.07); user-select:all; -webkit-user-select:all; text-align:center;
}
.warnbox{display:flex; gap:10px; padding:10px 12px; border:1px solid rgba(232,179,57,.4); background:rgba(232,179,57,.07); border-radius:6px; color:#f0d9a0; font-size:.88rem}
.warnbox .ic{color:var(--warn); margin-top:2px}

/* ---------- modal ---------- */
#layer{position:relative; z-index:100}
.modal-bg{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.74); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.modal{
  width:min(640px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); display:flex; flex-direction:column; overflow:hidden;
  background:var(--panel-2); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:var(--r); box-shadow:0 30px 90px rgba(0,0,0,.85);
  animation:pop .18s var(--ease);
}
.modal.wide{width:min(860px,100%)}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985)}}
.modal-h{display:flex; align-items:center; gap:12px; padding:14px 16px 10px}
.modal-h h2{flex:1; font-size:1.45rem; color:var(--text)}
.modal-b{padding:4px 16px 16px; overflow:auto; -webkit-overflow-scrolling:touch}
.modal-f{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; padding:12px 16px; border-top:1px solid var(--line-soft); background:rgba(0,0,0,.2)}
@media (max-width:640px){
  .modal-bg{align-items:flex-end; padding:0}
  .modal{width:100%; border-radius:14px 14px 0 0; max-height:92vh; max-height:92dvh}
  .modal-f .btn{flex:1}
}

/* ---------- paleta (Ctrl+K) ---------- */
.pal-bg{position:fixed; inset:0; z-index:120; display:flex; justify-content:center; align-items:flex-start; padding:12vh 16px 16px; background:rgba(0,0,0,.72); backdrop-filter:blur(3px)}
.pal{width:min(620px,100%); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.85); animation:pop .15s var(--ease)}
.pal-in{display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line-soft)}
.pal-in input{flex:1; min-width:0; height:54px; border:0; background:none; color:#fff; font:400 1.05rem 'Lato',sans-serif; outline:none}
.pal-list{max-height:min(56vh,440px); overflow:auto; padding:6px}
.pal-g{padding:10px 10px 4px; font:700 .64rem/1 'Lato',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.pal-i{display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:6px 10px; border:0; border-radius:6px; background:none; color:var(--text); text-align:left; cursor:pointer}
.pal-i[aria-selected="true"]{background:rgba(212,175,55,.14)}
.pal-i .ic{color:var(--gold)}
.pal-i small{margin-left:auto; color:var(--faint); font-size:.74rem; white-space:nowrap}
.pal-i span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- avisos ---------- */
#toasts{position:fixed; top:calc(var(--top) + 10px); right:16px; z-index:400; display:grid; gap:8px; width:min(400px,calc(100vw - 32px)); pointer-events:none}
@media (max-width:640px){#toasts{left:16px; right:16px; width:auto}}
.toast{
  pointer-events:none; padding:12px 14px; border-radius:8px; background:#1d1d23; border:1px solid var(--line); border-left:4px solid var(--gold);
  box-shadow:0 14px 40px rgba(0,0,0,.7); font-size:.92rem; animation:pop .18s var(--ease);
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--bad); background:#241616}

/* ---------- registro ---------- */
.log{display:grid; gap:0; border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden}
.log-i{display:grid; grid-template-columns:minmax(0,1fr); gap:2px; padding:10px 14px; border-bottom:1px solid var(--line-soft); background:var(--panel)}
.log-i:last-child{border-bottom:0}
.log-i:nth-child(even){background:var(--ink-2)}
.log-i b{font-weight:700}
.log-i .meta{color:var(--muted); font-size:.8rem}
@media (min-width:760px){.log-i{grid-template-columns:140px 150px minmax(0,1fr) auto; align-items:center; gap:12px}}

}
function ic(nome, extra) {
  var s = document.createElementNS(SVGNS, 'svg'), u = document.createElementNS(SVGNS, 'use');

  s.setAttribute('aria-hidden', 'true');

function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function pill(txt, tipo, icone) { return h('span', { class: 'pill' + (tipo ? ' ' + tipo : '') }, [icone ? ic(icone) : null, txt]); }
function link(txt, url, icone, classe) {

/* ===================== chamadas ao servidor ===================== */
var pend = 0;
function barra() { var b = $('#bar'); if (b) b.hidden = pend <= 0; }
function limpaErro(e) {
  var m = (e && e.message) ? e.message : String(e || '');

function rpc(fn) {

    var fim = function () { pend = Math.max(0, pend - 1); barra(); };
    try {
      if (!(window.google && google.script && google.script.run)) throw new Error('Esta tela só funciona aberta pela Central (Apps Script).');

      var r = google.script.run
        .withSuccessHandler(function (v) { fim(); ok(v); })
        .withFailureHandler(function (e) { fim(); falha(new Error(limpaErro(e))); });

  var fim = function () { btn.disabled = false; btn.classList.remove('busy'); };
  return promessa.then(function (r) { fim(); return r; }, function (e) { fim(); throw e; });

}

    h('div', { class: 'modal-h' }, [h('h2', { text: o.titulo }), h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Fechar', onclick: function () { api.fechar(); } }, ic('x'))]),
    corpo

    caixa: caixa,

      if (bg.parentNode) bg.parentNode.removeChild(bg);
      if (anterior && anterior.focus && document.body.contains(anterior)) { try { anterior.focus(); } catch (_) {} }
      if (o.aoFechar) o.aoFechar();

  (o.botoes || []).forEach(function (b) {
    var el = h('button', { type: 'button', class: 'btn' + (b.classe ? ' ' + b.classe : ''), text: b.rotulo });
    el.addEventListener('click', function () {

      corpo: h('p', { class: 'muted', text: texto }),
      botoes: [
        { rotulo: 'Cancelar', classe: 'ghost' },
        { rotulo: rotuloOk || 'Confirmar', classe: perigo ? 'danger' : 'pri', fn: function () { ok = true; } }

/* ===================== copiar ===================== */

  };

/* ===================== campos de formulário ===================== */

/* ===================== HOJE ===================== */

  var entrada = h('input', { type: 'text', placeholder: 'Buscar caso, cliente, pedido ou comando…', 'aria-label': 'Buscar', autocomplete: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'pal-lista' });

  var bg = h('div', { class: 'pal-bg' }, h('div', { class: 'pal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Busca rápida' }, [h('div', { class: 'pal-in' }, [ic('search'), entrada]), lista]));
  var api = { paleta: true, fechar: function () { var i = camadas.indexOf(api); if (i > -1) camadas.splice(i, 1); if (bg.parentNode) bg.parentNode.removeChild(bg); if (anterior && anterior.focus && document.body.contains(anterior)) { try { anterior.focus(); } catch (_) {} } } };
  var B = (S.estado && S.estado.busca) || { casos: [], acessos: [], pedidos: [] };
  var comandos = [
    { g: 'Ir para', t: 'Hoje', i: 'today', fn: function () { ir('hoje'); } }, { g: 'Ir para', t: 'Casos', i: 'folder', fn: function () { ir('casos'); } },
    { g: 'Ir para', t: 'Pedidos', i: 'inbox', fn: function () { ir('pedidos'); } }, { g: 'Ir para', t: 'Acessos', i: 'key', fn: function () { ir('acessos'); } },
    { g: 'Ir para', t: 'Registro', i: 'list', fn: function () { ir('registro'); } }, { g: 'Comandos', t: 'Novo caso', i: 'plus', fn: abrirNovoCaso },
    { g: 'Comandos', t: 'Criar acesso de teste', i: 'flask', fn: criarTeste }, { g: 'Comandos', t: 'Atualizar tudo', i: 'refresh', fn: function () { atualizarTudo(); } }
  ];
  var todos = comandos.concat(
    B.casos.map(function (c) { return { g: 'Casos', t: c.rotulo || c.id, s: c.numero || c.status, i: 'folder', fn: function () { ir('caso', { id: c.id }); } }; }),
    B.pedidos.map(function (p) { return { g: 'Pedidos', t: p.tipo + ' · ' + (p.caso || ''), s: p.protocolo, i: 'inbox', fn: function () { abrirPedidoPorProtocolo(p.protocolo); } }; }),

  );
  var desenhar = function () {
    var q = norm(entrada.value);
    itens = todos.filter(function (x) { return !q || norm(x.t + ' ' + (x.s || '') + ' ' + x.g).indexOf(q) !== -1; }).slice(0, 40);
    if (sel >= itens.length) sel = Math.max(0, itens.length - 1);
    clear(lista);
    if (!itens.length) { lista.appendChild(h('div', { class: 'pal-g', text: 'Nada encontrado' })); return; }
    var ultimo = '';
    itens.forEach(function (x, n) {
      if (x.g !== ultimo) { ultimo = x.g; lista.appendChild(h('div', { class: 'pal-g', role: 'presentation', text: x.g })); }
      lista.appendChild(h('button', { type: 'button', class: 'pal-i', role: 'option', 'aria-selected': String(n === sel), onclick: function () { escolher(n); }, onmousemove: function () { if (sel !== n) { sel = n; marcar(); } } }, [ic(x.i), h('span', { text: x.t }), x.s ? h('small', { text: x.s }) : null]));
    });
  };
  var marcar = function () { Array.prototype.forEach.call(lista.querySelectorAll('.pal-i'), function (b, n) { b.setAttribute('aria-selected', String(n === sel)); if (n === sel && b.scrollIntoView) b.scrollIntoView({ block: 'nearest' }); }); };
  var escolher = function (n) { var x = itens[n]; if (!x) return; api.fechar(); setTimeout(x.fn, 0); };
  entrada.addEventListener('input', function () { sel = 0; desenhar(); });
  entrada.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(itens.length - 1, sel + 1); marcar(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); marcar(); }

}

/* ===================== atualizar, atalhos e partida ===================== */
function atualizarTudo() {
  S.casos = null; S.pedidos = null; S.acessos = null; S.estado = null;
  var b = $('#btnRefresh');
  if (b) { b.classList.add('spin'); setTimeout(function () { b.classList.remove('spin'); }, 900); }
  ir(S.view, S.p);                                              // a própria tela recarrega o que precisa
  if (S.view !== 'hoje') carregarEstado().catch(function () {});  // mantém o contador de pedidos em dia
}

function iniciar() {
  Array.prototype.forEach.call(document.querySelectorAll('#nav [data-nav]'), function (b) {
    b.addEventListener('click', function () { ir(b.getAttribute('data-nav')); });
  });
  $('#btnPalette').addEventListener('click', paleta);
  $('#btnRefresh').addEventListener('click', atualizarTudo);

  document.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'k') { e.preventDefault(); paleta(); return; }
    if (e.key === 'Escape' && camadas.length) { e.preventDefault(); camadas[camadas.length - 1].fechar(); }
  });

  // voltou para a aba depois de um tempo: atualiza o contador e a tela "Hoje"
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !S.estado || Date.now() - S.ultimo < 120000) return;
    carregarEstado().then(function () { if (S.view === 'hoje' && !camadas.length) V.hoje(); }, function () {});
  });

  ir('hoje');
}

iniciar();

})();
